<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #08080f; font-family: "Microsoft YaHei", sans-serif; padding: 30px; }
  .sheet { display: grid; grid-template-columns: repeat(5, 256px); gap: 30px 34px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .label { color: #8b90a8; font-size: 14px; letter-spacing: 1px; text-align: center; line-height: 1.5; }
  .label b { color: #eceef8; margin-right: 8px; font-size: 16px; }
  .icon { width: 256px; height: 256px; position: relative; overflow: hidden; border-radius: 58px; }
  .mathfont { font-family: "Cambria Math", "Times New Roman", serif; }

  /* ============ 1 星环 Σ ============ */
  .t1 { background:
    radial-gradient(circle at 50% 40%, #1d2660 0%, #0B0F26 62%, #070a1c 100%); }
  .t1::before { content:""; position:absolute; inset:0; background-image:
    repeating-linear-gradient(0deg, rgba(255,255,255,.045) 0 1px, transparent 1px 34px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.045) 0 1px, transparent 1px 34px);
    mask-image: radial-gradient(circle at 50% 45%, #000 30%, transparent 78%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 30%, transparent 78%); }
  .t1 .halo { position:absolute; left:50%; top:47%; width:206px; height:206px; transform:translate(-50%,-50%);
    border-radius:50%; border:2px solid rgba(143,123,255,.28); }
  .t1 .ring { position:absolute; left:50%; top:47%; width:164px; height:164px; transform:translate(-50%,-50%) rotate(-50deg);
    border-radius:50%; border:9px solid transparent;
    border-top-color:#A78BFF; border-right-color:#FF6EC7; border-bottom-color:rgba(255,110,199,.15);
    filter: drop-shadow(0 0 10px rgba(150,110,255,.85)) drop-shadow(0 0 26px rgba(255,110,199,.35)); }
  .t1 .sig { position:absolute; left:50%; top:47%; transform:translate(-50%,-54%);
    font-size:112px; font-weight:700; color:#F4F2FF;
    text-shadow: 0 0 14px rgba(167,139,255,.95), 0 0 46px rgba(255,110,199,.5); }
  .t1 .p { position:absolute; border-radius:50%; background:#fff; }

  /* ============ 2 全息 π ============ */
  .t2 { background: linear-gradient(160deg, #16123a, #0a0a20 70%);
        display:flex; align-items:center; justify-content:center; }
  .t2 .glass { position:absolute; inset:34px; border-radius:38px;
    background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 38%, rgba(255,255,255,.08));
    border:1.5px solid rgba(255,255,255,.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px rgba(0,0,0,.5); }
  .t2 .g { position:relative; font-size:158px; font-style:italic; font-weight:700;
    background: linear-gradient(115deg, #7C6CFF 0%, #4CC9F0 28%, #B8F2FF 42%, #F72585 66%, #FFD166 88%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 4px 18px rgba(124,108,255,.55)); transform:translateY(-10px); }
  .t2 .shine { position:absolute; inset:34px; border-radius:38px; overflow:hidden; pointer-events:none; }
  .t2 .shine::before { content:""; position:absolute; left:-70px; top:-40px; width:60px; height:360px;
    background: rgba(255,255,255,.16); transform: rotate(24deg); filter: blur(6px); }

  /* ============ 3 霓虹 ∞ ============ */
  .t3 { background: radial-gradient(circle at 50% 45%, #14142a, #05050c 75%); }
  .t3 .g { position:absolute; left:50%; top:44%; transform:translate(-50%,-54%);
    font-size:196px; font-weight:700; color:#FFE3F2; line-height:1;
    text-shadow: 0 0 6px #fff, 0 0 16px #FF6EC7, 0 0 42px #FF6EC7, 0 0 90px #E0449F; }
  .t3 .ref { position:absolute; left:50%; top:58%; transform:translate(-50%,0) scaleY(-1);
    font-size:196px; font-weight:700; color:#FF6EC7; opacity:.18; filter: blur(7px); line-height:1; }
  .t3 .tube { position:absolute; left:50%; top:44%; transform:translate(-50%,-54%);
    font-size:196px; font-weight:700; color:transparent; line-height:1;
    -webkit-text-stroke: 3px rgba(255,110,199,.85); filter: blur(1px); }

  /* ============ 4 超立方体线框 ============ */
  .t4 { background: radial-gradient(circle at 50% 45%, #101736, #060814 75%); }
  .t4 svg { position:absolute; inset:0; }
  .t4 .tag { position:absolute; left:0; right:0; bottom:30px; text-align:center;
    font-size:19px; letter-spacing:5px; color:#7fd4ff; opacity:.85;
    text-shadow: 0 0 12px rgba(127,212,255,.8); font-family:"Cambria Math", serif; }

  /* ============ 5 钻石切面 π ============ */
  .t5 { background: radial-gradient(circle at 50% 42%, #191b46, #0a0b20 72%);
        display:flex; align-items:center; justify-content:center; }
  .t5 svg { position:absolute; inset:0; }
  .t5 .g { position:relative; font-size:120px; font-style:italic; font-weight:700; color:#fff;
    text-shadow: 0 0 16px rgba(255,255,255,.75), 0 0 40px rgba(124,108,255,.7); transform:translateY(-4px); }
  .t5 .spark { position:absolute; right:52px; top:44px; color:#fff; font-size:42px;
    text-shadow: 0 0 16px rgba(255,255,255,.95), 0 0 36px rgba(76,201,240,.9); transform:rotate(12deg); }

  /* ============ 6 轨道公式 ============ */
  .t6 { background: radial-gradient(circle at 50% 45%, #131b3e, #070a1a 74%); }
  .t6 svg { position:absolute; inset:0; }
  .t6 .sig { position:absolute; left:50%; top:47%; transform:translate(-50%,-52%);
    font-size:96px; font-weight:700; color:#F4F2FF;
    text-shadow: 0 0 14px rgba(143,123,255,.95), 0 0 40px rgba(76,201,240,.55); }

  /* ============ 7 液态金属 Σ ============ */
  .t7 { background: linear-gradient(155deg, #1c1531 0%, #0b0918 60%, #120e26 100%);
        display:flex; align-items:center; justify-content:center; }
  .t7 .g { font-size:172px; font-weight:700; line-height:1; transform:translateY(-8px);
    background: linear-gradient(180deg, #ffffff 0%, #d9d2ff 22%, #8F7BFF 46%, #3f3580 58%, #cfc6ff 74%, #FF6EC7 100%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter: drop-shadow(0 10px 24px rgba(90,60,200,.55)) drop-shadow(0 2px 2px rgba(255,255,255,.25)); }
  .t7 .ref { position:absolute; left:0; right:0; bottom:16px; text-align:center;
    font-size:74px; font-weight:700; line-height:1;
    background: linear-gradient(180deg, rgba(143,123,255,.5), transparent 85%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    transform: scaleY(-.6) translateY(14px); filter: blur(2px); }

  /* ============ 8 欧拉恒等式 ============ */
  .t8 { background:
    radial-gradient(circle at 78% 20%, rgba(76,201,240,.16), transparent 46%),
    radial-gradient(circle at 18% 84%, rgba(247,37,133,.16), transparent 46%),
    linear-gradient(160deg, #0d0f22, #080814 70%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; }
  .t8 .eq { font-size:46px; color:#F2F3FF; letter-spacing:1px; white-space:nowrap;
    text-shadow: 0 0 14px rgba(124,108,255,.75), 0 0 44px rgba(76,201,240,.4); }
  .t8 .eq sup { font-size:26px; }
  .t8 .eq .hl { background: linear-gradient(100deg, #4CC9F0, #F72585);
    -webkit-background-clip:text; background-clip:text; color:transparent; }
  .t8 .bar { width:150px; height:4px; border-radius:2px;
    background: linear-gradient(90deg, transparent, #4CC9F0, #F72585, transparent);
    box-shadow: 0 0 14px rgba(76,201,240,.8); }
  .t8 .cap { font-size:16px; letter-spacing:6px; color:#8b90a8; font-family:"Cambria Math", serif; }

  /* ============ 9 量子数学球 ============ */
  .t9 { background: radial-gradient(circle at 50% 44%, #101736, #060814 78%); }
  .t9 svg { position:absolute; inset:0; }

  /* ============ 10 光带 ∞ ============ */
  .t10 { background: radial-gradient(circle at 50% 45%, #0f1230, #07081a 75%); }
  .t10 svg { position:absolute; inset:0; }
</style>
</head>
<body>
<div class="sheet">

  <div class="cell"><div class="icon t1">
    <div class="halo"></div><div class="ring"></div><div class="sig mathfont">Σ</div>
    <div class="p" style="left:38px;top:74px;width:7px;height:7px;opacity:.9"></div>
    <div class="p" style="left:206px;top:56px;width:5px;height:5px;opacity:.7"></div>
    <div class="p" style="left:222px;top:168px;width:8px;height:8px;opacity:.8;background:#FF6EC7"></div>
    <div class="p" style="left:60px;top:200px;width:5px;height:5px;opacity:.6"></div>
    <div class="p" style="left:130px;top:34px;width:4px;height:4px;opacity:.55"></div>
  </div><div class="label"><b>1</b>星环 Σ<br>深空 · 双弧光环 · 呼应启动画面</div></div>

  <div class="cell"><div class="icon t2">
    <div class="glass"></div>
    <div class="g mathfont">π</div>
    <div class="shine"></div>
  </div><div class="label"><b>2</b>全息玻璃 π<br>玻璃拟态 · 全息渐变 · 高光斜切</div></div>

  <div class="cell"><div class="icon t3">
    <div class="ref mathfont">∞</div>
    <div class="g mathfont">∞</div>
    <div class="tube mathfont">∞</div>
  </div><div class="label"><b>3</b>霓虹管 ∞<br>霓虹灯管 · 地面反光</div></div>

  <div class="cell"><div class="icon t4">
    <svg viewBox="0 0 256 256">
      <defs>
        <linearGradient id="tess" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4CC9F0"/><stop offset="1" stop-color="#F72585"/>
        </linearGradient>
        <filter id="glow4" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur stdDeviation="4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g filter="url(#glow4)" stroke="url(#tess)" stroke-width="3.5" fill="none" stroke-linejoin="round">
        <rect x="52" y="52" width="152" height="152" rx="10"/>
        <rect x="94" y="94" width="68" height="68" rx="6" stroke-width="3"/>
        <line x1="52" y1="52" x2="94" y2="94"/><line x1="204" y1="52" x2="162" y2="94"/>
        <line x1="52" y1="204" x2="94" y2="162"/><line x1="204" y1="204" x2="162" y2="162"/>
      </g>
      <g fill="#fff">
        <circle cx="52" cy="52" r="5"/><circle cx="204" cy="52" r="5"/>
        <circle cx="52" cy="204" r="5"/><circle cx="204" cy="204" r="5"/>
        <circle cx="94" cy="94" r="4"/><circle cx="162" cy="94" r="4"/>
        <circle cx="94" cy="162" r="4"/><circle cx="162" cy="162" r="4"/>
      </g>
    </svg>
    <div class="tag">∑ · ∫ · π</div>
  </div><div class="label"><b>4</b>超立方体线框<br>四维几何 · 霓虹描边 · 顶点光珠</div></div>

  <div class="cell"><div class="icon t5">
    <svg viewBox="0 0 256 256">
      <defs>
        <linearGradient id="gemA" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#7C6CFF" stop-opacity=".95"/><stop offset="1" stop-color="#3B2E8C" stop-opacity=".9"/>
        </linearGradient>
        <linearGradient id="gemB" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="#F72585" stop-opacity=".8"/><stop offset="1" stop-color="#5B1E66" stop-opacity=".85"/>
        </linearGradient>
        <filter id="glow5" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="6" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g stroke="rgba(255,255,255,.35)" stroke-width="1.5">
        <polygon points="128,34 196,86 170,196 86,196 60,86" fill="url(#gemA)"/>
        <polygon points="128,34 196,86 128,110" fill="url(#gemB)"/>
        <polygon points="128,34 60,86 128,110" fill="#8F7BFF" opacity=".55"/>
        <polygon points="196,86 170,196 128,110" fill="#4CC9F0" opacity=".28"/>
        <polygon points="60,86 86,196 128,110" fill="#F72585" opacity=".22"/>
        <polygon points="128,110 170,196 86,196" fill="#2A1E6E" opacity=".65"/>
      </g>
      <polygon points="128,34 196,86 170,196 86,196 60,86" fill="none" stroke="rgba(255,255,255,.65)" stroke-width="2.5" filter="url(#glow5)"/>
    </svg>
    <div class="g mathfont">π</div>
    <div class="spark">✦</div>
  </div><div class="label"><b>5</b>钻石切面 π<br>低多边形宝石 · 内折射光</div></div>

  <div class="cell"><div class="icon t6">
    <svg viewBox="0 0 256 256">
      <defs>
        <linearGradient id="orb" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#8F7BFF"/><stop offset="1" stop-color="#4CC9F0"/>
        </linearGradient>
        <linearGradient id="orb2" x1="1" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FF6EC7"/><stop offset="1" stop-color="#FFD166"/>
        </linearGradient>
        <filter id="glow6" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g fill="none" filter="url(#glow6)">
        <ellipse cx="128" cy="128" rx="104" ry="46" stroke="url(#orb)" stroke-width="4" transform="rotate(-28 128 128)" opacity=".9"/>
        <ellipse cx="128" cy="128" rx="104" ry="46" stroke="url(#orb2)" stroke-width="4" transform="rotate(28 128 128)" opacity=".9"/>
        <circle cx="128" cy="128" r="57" stroke="rgba(255,255,255,.35)" stroke-width="2" stroke-dasharray="3 7"/>
      </g>
      <circle cx="36" cy="88" r="8" fill="#4CC9F0" filter="url(#glow6)"/>
      <circle cx="222" cy="170" r="8" fill="#FF6EC7" filter="url(#glow6)"/>
      <circle cx="212" cy="74" r="6" fill="#FFD166" filter="url(#glow6)"/>
    </svg>
    <div class="sig mathfont">Σ</div>
  </div><div class="label"><b>6</b>轨道公式<br>双椭圆轨道 · 粒子光珠 · 原子感</div></div>

  <div class="cell"><div class="icon t7">
    <div class="g mathfont">Σ</div>
    <div class="ref mathfont">Σ</div>
  </div><div class="label"><b>7</b>液态金属 Σ<br>铬紫渐变 · 镜面倒影</div></div>

  <div class="cell"><div class="icon t8">
    <div class="eq mathfont">e<sup><span class="hl">iπ</span></sup> + 1 = 0</div>
    <div class="bar"></div>
    <div class="cap">EULER</div>
  </div><div class="label"><b>8</b>欧拉恒等式<br>最美公式 · 排版霓虹</div></div>

  <div class="cell"><div class="icon t9">
    <svg viewBox="0 0 256 256">
      <defs>
        <radialGradient id="core" cx="42%" cy="36%" r="75%">
          <stop offset="0" stop-color="#B8A8FF"/><stop offset="45%" stop-color="#6C5CE7"/><stop offset="100%" stop-color="#241E5E"/>
        </radialGradient>
        <linearGradient id="lat" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#4CC9F0" stop-opacity=".1"/><stop offset=".5" stop-color="#4CC9F0" stop-opacity=".9"/><stop offset="1" stop-color="#4CC9F0" stop-opacity=".1"/>
        </linearGradient>
        <filter id="glow9" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <circle cx="128" cy="128" r="86" fill="url(#core)" filter="url(#glow9)"/>
      <g fill="none" stroke-width="2.4" filter="url(#glow9)">
        <ellipse cx="128" cy="128" rx="86" ry="30" stroke="url(#lat)"/>
        <ellipse cx="128" cy="128" rx="86" ry="62" stroke="url(#lat)" opacity=".55"/>
        <ellipse cx="128" cy="128" rx="30" ry="86" stroke="rgba(255,255,255,.5)"/>
      </g>
      <line x1="42" y1="128" x2="214" y2="128" stroke="rgba(255,255,255,.28)" stroke-width="1.6"/>
      <g font-family="Cambria Math, serif" font-size="21" fill="#EDEBFF" text-anchor="middle">
        <text x="128" y="122" opacity=".95">∫f</text>
        <text x="128" y="150" opacity=".8">dx</text>
      </g>
      <circle cx="214" cy="96" r="7" fill="#FF6EC7" filter="url(#glow9)"/>
      <path d="M 214 96 A 92 92 0 0 1 150 34" fill="none" stroke="rgba(255,110,199,.6)" stroke-width="2.5" stroke-dasharray="2 8"/>
    </svg>
  </div><div class="label"><b>9</b>量子数学球<br>经纬球体 · 刻度光弧 · 赛博感</div></div>

  <div class="cell"><div class="icon t10">
    <svg viewBox="0 0 256 256">
      <defs>
        <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#4CC9F0"/><stop offset=".5" stop-color="#8F7BFF"/><stop offset="1" stop-color="#FF6EC7"/>
        </linearGradient>
        <filter id="blur10" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="14"/></filter>
        <filter id="glow10" x="-40%" y="-40%" width="180%" height="180%">
          <feGaussianBlur stdDeviation="2.4" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <path d="M 74 128 C 74 84 122 84 128 122 C 134 84 182 84 182 128 C 182 172 134 172 128 134 C 122 172 74 172 74 128 Z"
            fill="none" stroke="url(#band)" stroke-width="26" stroke-linecap="round" filter="url(#blur10)" opacity=".85"/>
      <path d="M 74 128 C 74 84 122 84 128 122 C 134 84 182 84 182 128 C 182 172 134 172 128 134 C 122 172 74 172 74 128 Z"
            fill="none" stroke="url(#band)" stroke-width="16" stroke-linecap="round" filter="url(#glow10)"/>
      <path d="M 74 128 C 74 84 122 84 128 122 C 134 84 182 84 182 128 C 182 172 134 172 128 134 C 122 172 74 172 74 128 Z"
            fill="none" stroke="rgba(255,255,255,.9)" stroke-width="4" stroke-linecap="round" stroke-dasharray="60 999" stroke-dashoffset="-20"/>
    </svg>
  </div><div class="label"><b>10</b>光带 ∞<br>流体光管 · 三色渐变 · 流光高光</div></div>

</div>
</body>
</html>
