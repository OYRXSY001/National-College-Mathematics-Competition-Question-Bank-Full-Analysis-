<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 256px; height: 256px; background: transparent; overflow: hidden; }
  .icon { width: 256px; height: 256px; position: relative; overflow: hidden; border-radius: 58px;
    background: linear-gradient(160deg, #16123a, #0a0a20 70%);
    display: flex; align-items: center; justify-content: center; }
  .glass { position: absolute; inset: 34px; border-radius: 38px;
    background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.03) 38%, rgba(255,255,255,.08));
    border: 1.5px solid rgba(255,255,255,.25);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 18px 40px rgba(0,0,0,.5); }
  .g { position: relative; font-family: "Cambria Math", "Times New Roman", serif;
    font-size: 158px; font-style: italic; font-weight: 700;
    background: linear-gradient(115deg, #7C6CFF 0%, #4CC9F0 28%, #B8F2FF 42%, #F72585 66%, #FFD166 88%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 4px 18px rgba(124,108,255,.55)); transform: translateY(-10px); }
  .shine { position: absolute; inset: 34px; border-radius: 38px; overflow: hidden; pointer-events: none; }
  .shine::before { content: ""; position: absolute; left: -70px; top: -40px; width: 60px; height: 360px;
    background: rgba(255,255,255,.16); transform: rotate(24deg); filter: blur(6px); }
</style>
</head>
<body>
<div class="icon"><div class="glass"></div><div class="g">π</div><div class="shine"></div></div>
</body>
</html>
